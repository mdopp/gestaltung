name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: tests and WCAG AA contrast check
        run: go test -count=1 ./...
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: preview renders
        run: go run ./cmd/vorschau > /dev/null
